name: sim_gate
description: "Self-Hosted SMS API Android App - MVP"
publish_to: "none"
version: 0.0.4

environment:
  sdk: ^3.11.0

# -----------------------------------------------------------------------------
# Runtime dependencies
# -----------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  provider: ^6.1.2
  get_it: ^7.6.7

  # Database & storage
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.4.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # HTTP server & networking
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  connectivity_plus: ^5.0.2

  # UI & widgets
  qr_flutter: ^4.1.0
  fl_chart: ^0.66.0
  intl: ^0.19.0

  # Utilities
  uuid: ^4.3.3
  crypto: ^3.0.3

  # Android integration
  permission_handler: ^11.2.0
  package_info_plus: ^8.0.0

# -----------------------------------------------------------------------------
# Dev dependencies (testing & tooling)
# -----------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.3

# -----------------------------------------------------------------------------
# Flutter configuration
# -----------------------------------------------------------------------------
flutter:
  uses-material-design: true
