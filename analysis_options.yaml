# Analyzer & lint configuration for the SimGate Flutter app.
# Runs via `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "lib/generated/**"
    - "build/**"

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    public_member_api_docs: false
